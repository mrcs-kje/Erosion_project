      <canvas id="c38" role="img" aria-label="crawl_38: eight arms made of bracket characters"></canvas>

      <canvas id="c39" role="img" aria-label="crawl_39: a slim spine with dense paired barbs and a curled tail"></canvas>
      <span class="nm">crawl_39</span>
      <span class="mono">feather / barbs along the spine</span>
