<!doctype html><html><head><meta charset="utf-8"><title>glyph family</title>
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#090909;--fg:#e9e5dc;--dim:#7c7872;--wall:#3a3a38}
body{width:1280px;height:800px;background:var(--bg);color:var(--fg);font:14px/1.5 "Helvetica Neue",Helvetica,"Liberation Sans",Arial,sans-serif;letter-spacing:.04em;overflow:hidden;padding:28px 40px}
.mono{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.top{display:flex;justify-content:space-between;align-items:baseline;height:40px}
.top .t{font-size:18px;letter-spacing:.14em;color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:330px 330px;margin-top:10px}
.cell{border-top:1px solid var(--wall);border-left:1px solid var(--wall);display:flex;flex-direction:column;align-items:center;padding:10px 0 14px}
.cell:nth-child(5n){border-right:1px solid var(--wall)}
.cell:nth-child(n+6){border-bottom:1px solid var(--wall)}
.cell:nth-child(2){border-top-color:transparent}
.cell:nth-child(9){border-left-color:transparent}
.nm{font-family:"DejaVu Sans Mono",monospace;font-size:14px;letter-spacing:.06em;color:var(--fg);margin-top:auto}
.ds{margin-top:2px;text-align:center}
</style></head><body>
<div class="top"><span class="t">CRAWLERS / GLYPH FAMILY</span><span class="mono">Reference sheet 3 / bodies made of type</span></div>
<div class="grid" id="g"></div>
<script>
const O='#e8441b',G='#4d4b47',T='#bdb8ae';
let sd=5;const rnd=()=>{sd=(sd*9301+49297)%233280;return sd/233280};
const f=n=>n.toFixed(1);
const esc=c=>c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c;
const dot=(x,y,r=2.7,o=1)=>`<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${O}" opacity="${o}"/>`;
const ln=(a,b,w=1.5,o=1,c=O)=>`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity="${o}"/>`;
const tx=(c,x,y,s,r=0,o=1,fill=O)=>`<text x="${f(x)}" y="${f(y)}" font-size="${f(s)}" fill="${fill}" font-family="DejaVu Sans Mono,monospace" text-anchor="middle" dominant-baseline="central" opacity="${o.toFixed(2)}" transform="rotate(${f(r)} ${f(x)} ${f(y)})">${esc(c)}</text>`;
function along(P,d){let a=0;for(let i=1;i<P.length;i++){const dx=P[i][0]-P[i-1][0],dy=P[i][1]-P[i-1][1],l=Math.hypot(dx,dy);if(a+l>=d){const t=(d-a)/l;return[P[i-1][0]+dx*t,P[i-1][1]+dy*t,Math.atan2(dy,dx)]}a+=l}return null}
const F=[];
// 21 sentence
F.push(()=>{const P=[];for(let x=12;x<=228;x+=2)P.push([x,140+Math.sin((x-12)/26)*36]);const S='the staircase had thirteen steps';let s='';
 for(let i=0;i<S.length;i++){const q=along(P,8+i*7.7);if(!q)break;const ch=i<3?'.':S[i];s+=tx(ch,q[0],q[1],9+i*.22,q[2]*57.3,.3+.7*i/31)}
 const h=along(P,8+S.length*7.7+6);if(h)s+=`<rect x="${f(h[0]-4)}" y="${f(h[1]-9)}" width="8" height="18" fill="${O}" transform="rotate(${f(h[2]*57.3)} ${f(h[0])} ${f(h[1])})"/>`;return s});
// 22 lexipede
F.push(()=>{const W=['stair','door','tape','light','wall','rumor','third','count'];let s='';const hx=120,hy=135;
 const A=[-50,-15,20,55,230,195,160,125];
 for(let i=0;i<8;i++){const a=A[i]*Math.PI/180,right=i<4,b=right?.85:-.85,e1=[hx+Math.cos(a)*38,hy+Math.sin(a)*38],e2=[e1[0]+Math.cos(a+b)*46,e1[1]+Math.sin(a+b)*46],P=[[hx,hy],e1,e2];
  for(let k=0;k<10;k++){const q=along(P,20+k*8.4);if(!q)break;s+=tx(k<W[i].length?W[i][k]:'.',q[0],q[1],13-k*.35,q[2]*57.3,k<W[i].length?1-k*.04:.4)}}
 return s+`<circle cx="${hx}" cy="${hy}" r="13" fill="#090909" stroke="${O}" stroke-width="1.6"/>`+tx('@',hx,hy,19)});
// 23 ramp
F.push(()=>{const R='@%#*+=-:.. '.split('');let s='';for(let i=0;i<14;i++){const x=214-i*14,o=1-i*.05,c=R[Math.min(i,R.length-2)];
  s+=tx(c,x,140,i==0?30:20-i*.5,0,o)+tx('/',x-2,116,12,0,o*.9)+tx('\\',x+2,164,12,0,o*.9)}
 return s+tx('~',226,118,16,-30)+tx('~',226,162,16,30)});
// 24 flock
F.push(()=>{let s=tx('WORD',172,82,30);const L=[['eat',120,96,14,-6,.95],['crawl',82,114,13,-10,.85],['door',126,128,12,-14,.8],['tape',92,148,12,-12,.72],['stair',46,132,11,-8,.6],['wall',128,162,11,-16,.62],['draft',70,174,10,-10,.5],['room',34,158,10,-6,.42],['rain',104,188,10,-14,.4],['twelve',52,200,9,-10,.32],['gap',144,196,9,-18,.3],['tide',26,186,9,-6,.25],['fade',84,216,9,-10,.2]];
 L.forEach(([w,x,y,z,r,o])=>s+=tx(w,x,y,z,r,o));return s});
// 25 hump
F.push(()=>{let s=`<path d="M70 200 V112 M70 134 Q70 106 98 106 Q121 106 121 134 V200 M121 134 Q121 106 149 106 Q172 106 172 134 V200" fill="none" stroke="${O}" stroke-width="3" stroke-linecap="round"/>`;
 [[70,200],[121,200],[172,200]].forEach(([x,y],i)=>{s+=ln([x,y],[x-8,y+20],1.5)+ln([x-8,y+20],[x+2,y+34],1.5)});
 s+=dot(86,120,4.4)+ln([70,106],[58,88],1.2)+ln([76,104],[70,84],1.2);
 return s+tx('m',204,196,26,0,.55)+tx('m',226,196,17,0,.3)});
// 26 spine
F.push(()=>{const B=[['(',')'],['{','}'],['[',']'],['<','>']];let s=tx('@',120,34,32)+dot(110,22,0);
 for(let i=0;i<9;i++){const y=68+i*20,half=24-i*2.2,sz=25-i*1.6,o=1-i*.07,[l,r]=B[i%4];s+=tx(l,120-half,y,sz,0,o)+tx(r,120+half,y,sz,0,o)+dot(120,y,2.2-i*.12,o)+ln([120-half-8,y+7],[120-half-20+i,y+12+i*.5],1,o*.7)+ln([120+half+8,y+7],[120+half+20-i,y+12+i*.5],1,o*.7)}
 return s+dot(118,246,1.5,.5)+dot(123,256,1.2,.35)});
// 27 ouroboros
F.push(()=>{const S=('THE WORM EATS THE WORD ').repeat(3);let s=`<circle cx="120" cy="135" r="60" fill="none" stroke="${G}" stroke-dasharray="2 6"/>`;
 for(let k=0;k<46;k++){const a=(-90+k*(360/48))*Math.PI/180,r=82;s+=tx(S[k]===' '?'·':S[k],120+Math.cos(a)*r,135+Math.sin(a)*r,20-k*.26,a*57.3+90,1-k*.012)}
 return s+dot(120,121,2.8)+dot(131,123,2.8)});
// 28 keycaps
F.push(()=>{const L='CRAWLING'.split('');let s='',pts=[];for(let i=0;i<8;i++){const x=22+i*28,y=140+Math.sin(i*.9)*30;pts.push([x,y,Math.atan(Math.cos(i*.9)*30*.9/28)*57.3])}
 for(let i=1;i<8;i++)s+=ln(pts[i-1],pts[i],.8,.3);
 pts.forEach(([x,y,r],i)=>{const sc=i==7?1.3:1,press=(i==3||i==5)?3:0;s+=`<g transform="translate(${f(x)} ${f(y+press)}) rotate(${f(r)}) scale(${sc})"><rect x="-13" y="-13" width="26" height="26" rx="5" fill="${press?O:'none'}" fill-opacity=".22" stroke="${O}" stroke-width="1.5"/>${i%2?`<line x1="-6" y1="13" x2="-10" y2="24" stroke="${O}" stroke-width="1.3" stroke-linecap="round"/><line x1="6" y1="13" x2="10" y2="24" stroke="${O}" stroke-width="1.3" stroke-linecap="round"/>`:''}<text x="0" y="1" font-size="14" fill="${O}" font-family="DejaVu Sans Mono,monospace" text-anchor="middle" dominant-baseline="central">${L[i]}</text></g>`});return s});
// 29 drip
F.push(()=>{const W='thirteen'.split('');let s='';W.forEach((c,j)=>{const x=72+j*13.6;s+=tx(c,x,52,20);const n=4+Math.floor(rnd()*4);let y=52;for(let k=1;k<=n;k++){y+=13+k*2.5+rnd()*4;if(y>240)break;s+=tx(c,x+(rnd()-.5)*3,y,17-k*1.6,0,Math.max(.12,.8-k*.12))}});
 s+=tx('e',200,170,12,12,.5)+tx('n',36,200,10,-10,.4)+`<line x1="40" y1="252" x2="200" y2="252" stroke="${G}" stroke-dasharray="1 5"/>`;return s});
// 30 braille
F.push(()=>{let s='',pts=[];for(let i=0;i<7;i++)pts.push([26+i*30,140+Math.sin(i*.8)*28,Math.atan(Math.cos(i*.8)*28*.8/30)*57.3]);
 for(let i=1;i<7;i++)s+=ln(pts[i-1],pts[i],.8,.3);
 pts.forEach(([x,y,r],i)=>{const sc=i==6?1.4:1;s+=`<g transform="translate(${f(x)} ${f(y)}) rotate(${f(r)}) scale(${sc})"><rect x="-9" y="-14" width="18" height="28" rx="3" fill="none" stroke="${G}" stroke-width="1"/>`;let n=0;
  for(let c=0;c<2;c++)for(let rr=0;rr<3;rr++){const on=i==6?!(c==1&&rr==2):(rnd()<.55);n+=on;s+=on?`<circle cx="${c?4.5:-4.5}" cy="${(rr-1)*9}" r="2.2" fill="${O}"/>`:`<circle cx="${c?4.5:-4.5}" cy="${(rr-1)*9}" r="1.5" fill="none" stroke="${G}"/>`}
  s+='</g>'});return s+ln([pts[6][0]+18,pts[6][1]-10],[pts[6][0]+28,pts[6][1]-20],1.2)+ln([pts[6][0]+18,pts[6][1]+10],[pts[6][0]+28,pts[6][1]+20],1.2)});
const N=['sentence / a walking line of text','lexipede / legs spelled as words','ramp / body fades through type','flock / words follow a leader','hump / a letter that walks','spine / vertebrae of brackets','ouroboros / eats its own text','keycaps / spells itself walking','drip / letters fall and thin','braille / cells, filled and empty'];
const short=['sentence / a text that walks','lexipede / legs spelled as words','ramp / body fades through type','flock / words follow a leader','hump / a letter that walks','spine / vertebrae of brackets','ouroboros / eats its own text','keycaps / spells itself','drip / letters fall and thin','braille / filled and empty cells'];
document.getElementById('g').innerHTML=F.map((fn,i)=>`<div class="cell"><svg width="240" height="270" viewBox="0 0 240 270" style="overflow:visible">${fn()}</svg><span class="nm">crawl_${i+21}</span><span class="mono ds">${short[i]}</span></div>`).join('');
</script></body></html>
